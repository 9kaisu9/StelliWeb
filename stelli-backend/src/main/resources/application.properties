spring.application.name=stelli-backend

spring.datasource.url=jdbc:sqlite:${DB_PATH:./stelli.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3}

app.uploads-path=${UPLOADS_PATH:./uploads}
app.whisper.model=${WHISPER_MODEL:base}
